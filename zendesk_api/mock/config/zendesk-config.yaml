plugin: openapi
specFile: zendesk-support-api.yaml
resources:
  - path: "/api/v2/custom_statuses"
    method: GET
    response:
      file: list_response.json
      statusCode: 200
  - path: "/api/v2/custom_statuses"
    method: POST
    requestBody:
      jsonPath: $.custom_status.agent_label
      value: one
    response:
      file: agent_label_one_response.json
      statusCode: 201
  - path: "/api/v2/custom_statuses/{custom_status_id}"
    method: GET
    pathParams:
      custom_status_id: 19682857720989
    response:
      file: agent_label_one_response.json
      statusCode: 200
  - path: "/api/v2/custom_statuses/{custom_status_id}"
    method: PUT
    requestBody:
      jsonPath: $.custom_status.agent_label
      value: two
    response:
      file: agent_label_two_response.json
      statusCode: 200
  - path: "/api/v2/custom_statuses/{custom_status_id}"
    method: GET
    pathParams:
      custom_status_id: 19691825497501
    response:
      file: agent_label_two_response.json
      statusCode: 200
  - path: "/api/v2/custom_roles"
    method: GET
    response:
      file: custom_roles_list_response.json
      template: true
      statusCode: 200
  - path: "/api/v2/custom_roles"
    method: POST
    capture:
      name:
        store: customrole
        requestBody:
          jsonPath: $.custom_role.name
    response:
      file: custom_role_response.json
      template: true
      statusCode: 200
  - path: "/api/v2/custom_roles/{custom_role_id}"
    method: GET
    pathParams:
      custom_role_id: 10127
    response:
      file: custom_role_response.json
      template: true
      statusCode: 200
  - path: "/api/v2/custom_roles/{custom_role_id}"
    method: PUT
    pathParams:
      custom_role_id: 10127
    capture:
      name:
        store: customrole
        requestBody:
          jsonPath: $.custom_role.name
    response:
      file: custom_role_response.json
      template: true
      statusCode: 200
  - path: "/api/v2/custom_roles/{custom_role_id}"
    method: DELETE
    pathParams:
      custom_role_id: 10127
    response:
      statusCode: 204
