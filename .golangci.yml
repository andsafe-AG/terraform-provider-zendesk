# Visit https://golangci-lint.run/ for usage documentation
# and information on other useful linters
version: "2"

issues:
  max-same-issues: 0

linters:
  default: none
  enable:
    - durationcheck
    - errcheck
    - forcetypeassert
    #- godot
    - govet
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - predeclared
    - staticcheck # includes the former gosimple and stylecheck
    - unconvert
    - unparam
    - unused
    - usetesting # replaces the removed tenv
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - zendesk_api/zendesk_client.gen.go

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - zendesk_api/zendesk_client.gen.go
